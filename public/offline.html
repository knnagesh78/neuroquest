<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta name="theme-color" content="#2d1d17" /><title>
    NeuroQuest · Let’s reconnect</title
  ><style>
    body {
      margin: 0;
      background: #2d1d17;
      color: #faf0e1;
      font:
        17px/1.6 system-ui,
        sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 440px;
      padding: 40px;
      text-align: center;
    }
    span {
      display: inline-grid;
      place-items: center;
      background: #432b20;
      border-radius: 22px;
      color: #faf0e1;
      font-size: 38px;
      width: 78px;
      height: 78px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
    }
    p {
      color: #c9ab92;
    }
    a {
      display: inline-block;
      background: #b85024;
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      text-decoration: none;
    }
    small {
      display: block;
      margin-top: 28px;
      font-size: 13px;
    }
  </style>
  <main>
    <span aria-hidden="true">◇</span>
    <h1>Your palace is waiting.</h1>
    <p>
      Connect to the internet to sign in and open your cloud notes. Your saved
      ideas will be here when you’re back.
    </p>
    <a href="/">Try again</a
    ><small>NeuroQuest · A place for everything you know</small>
  </main>
</html>
